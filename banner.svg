<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Shashank T - Artificial Intelligence and Data Science Undergraduate">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="45%" stop-color="#0B192C"/>
      <stop offset="75%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38BDF8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="wave">
      <path d="M0,0 H1200 V190 C1000,230 800,150 600,190 C400,230 200,150 0,190 Z"/>
    </clipPath>
  </defs>

  <style>
    .title { font: 700 58px 'Courier New', monospace; fill: #00F5D4; letter-spacing: 6px; animation: fade 1.6s ease-out both; }
    .sub   { font: 600 17px 'Courier New', monospace; fill: #A855F7; letter-spacing: 3px; animation: fade 2.2s ease-out both; }
    .tag   { font: 500 13px 'Courier New', monospace; fill: #38BDF8; letter-spacing: 2px; animation: fade 2.8s ease-out both; }
    .scan  { animation: scan 4s linear infinite; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scan { from { transform: translateX(-1200px); } to { transform: translateX(1200px); } }
  </style>

  <g clip-path="url(#wave)">
    <rect width="1200" height="230" fill="url(#bg)"/>
    <rect width="1200" height="230" fill="url(#grid)"/>
    <circle cx="1040" cy="40" r="120" fill="#A855F7" fill-opacity="0.08"/>
    <circle cx="140" cy="170" r="110" fill="#00F5D4" fill-opacity="0.06"/>
    <rect class="scan" x="0" y="0" width="300" height="230" fill="url(#line)" fill-opacity="0.07"/>
  </g>

  <text class="tag" x="600" y="52" text-anchor="middle">[ SYSTEM ONLINE ]</text>
  <text class="title" x="600" y="115" text-anchor="middle" filter="url(#glow)">SHASHANK T</text>
  <rect x="380" y="132" width="440" height="2" fill="url(#line)"/>
  <text class="sub" x="600" y="164" text-anchor="middle">ARTIFICIAL INTELLIGENCE &amp; DATA SCIENCE UNDERGRADUATE</text>
</svg>
